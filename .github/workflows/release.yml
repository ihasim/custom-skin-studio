name: Build & Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "6.8.3"
  QT_MODULES: "qtquick3d qtmultimedia qtshadertools qtquicktimeline"

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"; else echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Deploy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\CustomSkinStudio | Out-Null
          Copy-Item build\CustomSkinStudio.exe dist\CustomSkinStudio\
          windeployqt --release --qmldir qml --compiler-runtime dist\CustomSkinStudio\CustomSkinStudio.exe
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md dist\CustomSkinStudio\
          # smoke test: the executable starts and the QML loads (screenshot mode exits by itself)
          $p = Start-Process dist\CustomSkinStudio\CustomSkinStudio.exe -ArgumentList "--screenshot","smoke.png" -PassThru -Wait
          if (-not (Test-Path smoke.png)) { Write-Warning "smoke test: no screenshot (exit $($p.ExitCode))" }
          Compress-Archive -Path dist\CustomSkinStudio -DestinationPath "dist\CustomSkinStudio-${{ steps.v.outputs.version }}-windows-portable.zip"
      - name: Installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" "/DSourceDir=..\dist\CustomSkinStudio" installer\CustomSkinStudio.iss
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
            smoke.png

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"; else echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          modules: ${{ env.QT_MODULES }}
          cache: true
      - name: Build
        run: |
          brew install ninja || true
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build --target SkinStudio
      - name: Deploy
        run: |
          mkdir -p dist
          cp -R build/CustomSkinStudio.app dist/
          macdeployqt "dist/CustomSkinStudio.app" -qmldir=qml
          codesign --force --deep --sign - "dist/CustomSkinStudio.app"
          mv "dist/CustomSkinStudio.app" "dist/Custom Skin Studio.app"
          mkdir -p dmg && cp -R "dist/Custom Skin Studio.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Custom Skin Studio" -srcfolder dmg -ov -format UDZO "dist/CustomSkinStudio-${{ steps.v.outputs.version }}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, '-') || startsWith(github.ref, 'refs/tags/v0.') }}
          generate_release_notes: true
          files: |
            out/windows/**/*.exe
            out/windows/**/*.zip
            out/macos/*.dmg
